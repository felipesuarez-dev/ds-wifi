name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer versión
        id: version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: Verificar si el tag existe
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.v }}"
          git push origin "v${{ steps.version.outputs.v }}"

      - name: Extraer notas del CHANGELOG
        if: steps.tag.outputs.exists == 'false'
        run: |
          sed -n '/^## \[${{ steps.version.outputs.v }}\]/,/^## \[/p' CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Release v${{ steps.version.outputs.v }}" > RELEASE_NOTES.md

      - name: Publicar GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: v${{ steps.version.outputs.v }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
